<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bus Driver App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(79, 70, 229, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
            }
        }
        
        .emergency-pulse {
            animation: emergencyPulse 1.5s infinite;
        }
        
        @keyframes emergencyPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
        
        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .switch {
            position: relative;
            width: 50px;
            height: 28px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4F46E5;
        }
        
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 40;
        }
        
        .nav-item.active {
            color: #4F46E5;
        }
        
        .nav-item.active i {
            transform: scale(1.2);
        }
        
        .progress-ring {
            transition: stroke-dashoffset 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-gray-100 relative">
        
        <!-- Status Bar -->
        <div class="safe-area-top sticky top-0 z-30">
            <div id="statusBar" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div id="onlineIndicator" class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></div>
                        <span id="statusText" class="font-semibold text-sm">ONLINE</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs opacity-90">BUS-001</span>
                        <button id="notificationBell" class="relative">
                            <i class="fas fa-bell text-lg"></i>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center hidden">2</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="pb-20">
            
            <!-- Trip Status Card -->
            <div class="px-4 pt-4">
                <div class="bg-white rounded-2xl shadow-lg p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h1 class="text-xl font-bold text-gray-800">Route 42</h1>
                            <p class="text-sm text-gray-600">Central Station → Airport</p>
                        </div>
                        <div class="text-right">
                            <span id="tripTime" class="text-sm font-semibold text-gray-700">00:00:00</span>
                            <p class="text-xs text-gray-500">Trip Duration</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <button id="startBtn" class="col-span-1 py-3 bg-green-600 text-white rounded-xl font-semibold text-sm active:scale-95 transition-transform">
                            <i class="fas fa-play mr-1"></i> Start
                        </button>
                        <button id="pauseBtn" class="col-span-1 py-3 bg-yellow-500 text-white rounded-xl font-semibold text-sm active:scale-95 transition-transform opacity-50" disabled>
                            <i class="fas fa-pause mr-1"></i> Pause
                        </button>
                        <button id="stopBtn" class="col-span-1 py-3 bg-red-600 text-white rounded-xl font-semibold text-sm active:scale-95 transition-transform opacity-50" disabled>
                            <i class="fas fa-stop mr-1"></i> Stop
                        </button>
                    </div>
                </div>
            </div>

            <!-- Live Stats Grid -->
            <div class="px-4 pt-3 grid grid-cols-3 gap-3">
                <div class="bg-white rounded-xl shadow p-3">
                    <div class="flex items-center justify-between mb-1">
                        <i class="fas fa-tachometer-alt text-indigo-600"></i>
                        <span class="text-xs text-gray-500">Speed</span>
                    </div>
                    <p class="text-xl font-bold text-gray-800" id="speedDisplay">0</p>
                    <p class="text-xs text-gray-500">km/h</p>
                </div>
                <div class="bg-white rounded-xl shadow p-3">
                    <div class="flex items-center justify-between mb-1">
                        <i class="fas fa-users text-indigo-600"></i>
                        <span class="text-xs text-gray-500">Passengers</span>
                    </div>
                    <p class="text-xl font-bold text-gray-800" id="passengerDisplay">0</p>
                    <p class="text-xs text-gray-500">/ 40</p>
                </div>
                <div class="bg-white rounded-xl shadow p-3">
                    <div class="flex items-center justify-between mb-1">
                        <i class="fas fa-clock text-indigo-600"></i>
                        <span class="text-xs text-gray-500">Next Stop</span>
                    </div>
                    <p class="text-sm font-bold text-gray-800 truncate" id="nextStopDisplay">-</p>
                    <p class="text-xs text-gray-500" id="nextStopTime">--:--</p>
                </div>
            </div>

            <!-- Location Status -->
            <div class="px-4 pt-3">
                <div class="bg-white rounded-xl shadow p-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <i class="fas fa-satellite-dish text-indigo-600"></i>
                            <span class="text-sm font-medium">GPS Signal</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span id="gpsStatus" class="text-xs text-green-600">Strong</span>
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        </div>
                    </div>
                    <div class="mt-2 text-xs text-gray-600 flex items-center justify-between">
                        <span>Lat: <span id="latDisplay">40.7128</span></span>
                        <span>Lng: <span id="lngDisplay">-74.0060</span></span>
                    </div>
                </div>
            </div>

            <!-- Passenger Management -->
            <div class="px-4 pt-3">
                <div class="bg-white rounded-xl shadow p-4">
                    <h2 class="text-sm font-bold text-gray-800 mb-3">Passenger Count</h2>
                    <div class="flex items-center justify-between">
                        <button id="decreasePassenger" class="w-12 h-12 bg-red-100 text-red-600 rounded-xl text-2xl font-bold active:scale-95 transition-transform">
                            -
                        </button>
                        <div class="text-center">
                            <p class="text-3xl font-bold text-indigo-600" id="passengerCount">0</p>
                            <div class="mt-2 w-32 bg-gray-200 rounded-full h-2 overflow-hidden">
                                <div id="capacityBar" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
                            </div>
                            <p class="text-xs text-gray-500 mt-1" id="capacityText">0% Full</p>
                        </div>
                        <button id="increasePassenger" class="w-12 h-12 bg-green-100 text-green-600 rounded-xl text-2xl font-bold active:scale-95 transition-transform">
                            +
                        </button>
                    </div>
                </div>
            </div>

            <!-- Current Route Progress -->
            <div class="px-4 pt-3">
                <div class="bg-white rounded-xl shadow p-4">
                    <h2 class="text-sm font-bold text-gray-800 mb-3">Route Progress</h2>
                    <div class="relative">
                        <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-gray-200"></div>
                        <div id="routeProgress" class="space-y-4">
                            <!-- Route stops will be dynamically inserted here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="px-4 pt-3">
                <div class="grid grid-cols-2 gap-3">
                    <button id="reportIssue" class="bg-white rounded-xl shadow p-4 text-center active:scale-95 transition-transform">
                        <i class="fas fa-exclamation-circle text-2xl text-yellow-500 mb-2"></i>
                        <p class="text-sm font-semibold text-gray-700">Report Issue</p>
                    </button>
                    <button id="callDispatch" class="bg-white rounded-xl shadow p-4 text-center active:scale-95 transition-transform">
                        <i class="fas fa-phone-alt text-2xl text-indigo-600 mb-2"></i>
                        <p class="text-sm font-semibold text-gray-700">Call Dispatch</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- Emergency Button -->
        <button id="emergencyBtn" class="emergency-pulse fixed bottom-24 right-4 w-16 h-16 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center z-30 active:scale-95 transition-transform">
            <i class="fas fa-exclamation-triangle text-2xl"></i>
        </button>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="flex justify-around items-center py-2 px-4">
                <button class="nav-item active flex flex-col items-center" data-tab="home">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">Home</span>
                </button>
                <button class="nav-item flex flex-col items-center" data-tab="schedule">
                    <i class="fas fa-calendar-alt text-xl"></i>
                    <span class="text-xs mt-1">Schedule</span>
                </button>
                <button class="nav-item flex flex-col items-center" data-tab="map">
                    <i class="fas fa-map-marker-alt text-xl"></i>
                    <span class="text-xs mt-1">Map</span>
                </button>
                <button class="nav-item flex flex-col items-center" data-tab="profile">
                    <i class="fas fa-user text-xl"></i>
                    <span class="text-xs mt-1">Profile</span>
                </button>
            </div>
        </div>

        <!-- Emergency Modal -->
        <div id="emergencyModal" class="fixed inset-0 z-50 hidden">
            <div class="modal-overlay absolute inset-0" onclick="closeEmergencyModal()"></div>
            <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl slide-up max-w-md mx-auto p-6">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-exclamation-triangle text-3xl text-red-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Emergency</h3>
                    <p class="text-sm text-gray-600 mt-2">Select the type of emergency:</p>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button class="p-4 bg-red-50 rounded-xl active:scale-95 transition-transform" onclick="sendEmergency('accident')">
                        <i class="fas fa-car-crash text-2xl text-red-600 mb-2"></i>
                        <p class="text-sm font-semibold">Accident</p>
                    </button>
                    <button class="p-4 bg-orange-50 rounded-xl active:scale-95 transition-transform" onclick="sendEmergency('breakdown')">
                        <i class="fas fa-tools text-2xl text-orange-600 mb-2"></i>
                        <p class="text-sm font-semibold">Breakdown</p>
                    </button>
                    <button class="p-4 bg-yellow-50 rounded-xl active:scale-95 transition-transform" onclick="sendEmergency('medical')">
                        <i class="fas fa-medkit text-2xl text-yellow-600 mb-2"></i>
                        <p class="text-sm font-semibold">Medical</p>
                    </button>
                    <button class="p-4 bg-purple-50 rounded-xl active:scale-95 transition-transform" onclick="sendEmergency('security')">
                        <i class="fas fa-shield-alt text-2xl text-purple-600 mb-2"></i>
                        <p class="text-sm font-semibold">Security</p>
                    </button>
                </div>
                
                <button class="w-full mt-4 py-3 bg-gray-200 text-gray-700 rounded-xl font-semibold" onclick="closeEmergencyModal()">
                    Cancel
                </button>
            </div>
        </div>

        <!-- Report Issue Modal -->
        <div id="reportModal" class="fixed inset-0 z-50 hidden">
            <div class="modal-overlay absolute inset-0" onclick="closeReportModal()"></div>
            <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl slide-up max-w-md mx-auto p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Report Issue</h3>
                
                <div class="space-y-3">
                    <select id="issueType" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select issue type...</option>
                        <option value="traffic">Traffic Delay</option>
                        <option value="mechanical">Mechanical Issue</option>
                        <option value="passenger">Passenger Issue</option>
                        <option value="other">Other</option>
                    </select>
                    
                    <textarea id="issueDescription" rows="4" placeholder="Describe the issue..." class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    
                    <button class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold active:scale-95 transition-transform" onclick="submitReport()">
                        Submit Report
                    </button>
                    
                    <button class="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-semibold" onclick="closeReportModal()">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Notification Panel -->
        <div id="notificationPanel" class="fixed inset-0 z-40 hidden">
            <div class="modal-overlay absolute inset-0" onclick="closeNotifications()"></div>
            <div class="absolute top-0 right-0 bottom-0 w-80 bg-white shadow-2xl slide-up max-w-full">
                <div class="p-4 border-b">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold">Notifications</h3>
                        <button onclick="closeNotifications()" class="text-gray-500">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div id="notificationList" class="overflow-y-auto h-full p-4 space-y-3">
                    <!-- Notifications will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // App State
        const state = {
            isOnline: false,
            tripStarted: false,
            tripPaused: false,
            passengerCount: 0,
            maxPassengers: 40,
            speed: 0,
            currentStopIndex: 0,
            tripStartTime: null,
            tripElapsedTime: 0,
            tripTimerInterval: null,
            locationTrackingInterval: null,
            speedInterval: null,
            notifications: [
                { id: 1, message: 'Welcome to Bus Driver App', time: 'Just now', type: 'info' },
                { id: 2, message: 'Route 42 schedule loaded', time: 'Just now', type: 'success' }
            ]
        };

        // Mock schedule data
        const schedule = [
            { id: 1, stop: 'Central Station', arrival: '10:30', departure: '10:32', status: 'pending' },
            { id: 2, stop: 'Main Street', arrival: '10:35', departure: '10:37', status: 'pending' },
            { id: 3, stop: 'Park Avenue', arrival: '10:42', departure: '10:44', status: 'pending' },
            { id: 4, stop: '5th Avenue', arrival: '10:48', departure: '10:50', status: 'pending' },
            { id: 5, stop: 'Market Square', arrival: '10:55', departure: '10:57', status: 'pending' },
            { id: 6, stop: 'Airport Terminal', arrival: '11:05', departure: '11:10', status: 'pending' }
        ];

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule();
            updatePassengerDisplay();
            updateNotificationBadge();
            startLocationTracking();
            initializeEventListeners();
            
            // Simulate GPS location updates
            setInterval(() => {
                if (state.tripStarted && !state.tripPaused) {
                    updateGPSCoordinates();
                }
            }, 3000);
        });

        function initializeEventListeners() {
            // Trip controls
            document.getElementById('startBtn').addEventListener('click', startTrip);
            document.getElementById('pauseBtn').addEventListener('click', pauseTrip);
            document.getElementById('stopBtn').addEventListener('click', stopTrip);
            
            // Passenger management
            document.getElementById('increasePassenger').addEventListener('click', () => updatePassengerCount(1));
            document.getElementById('decreasePassenger').addEventListener('click', () => updatePassengerCount(-1));
            
            // Emergency
            document.getElementById('emergencyBtn').addEventListener('click', openEmergencyModal);
            
            // Report issue
            document.getElementById('reportIssue').addEventListener('click', openReportModal);
            
            // Call dispatch
            document.getElementById('callDispatch').addEventListener('click', callDispatch);
            
            // Notifications
            document.getElementById('notificationBell').addEventListener('click', openNotifications);
            
            // Bottom navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    handleTabChange(item.dataset.tab);
                });
            });
        }

        function startTrip() {
            if (state.tripStarted) return;
            
            state.isOnline = true;
            state.tripStarted = true;
            state.tripPaused = false;
            state.tripStartTime = Date.now();
            
            // Update UI
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').classList.add('opacity-50');
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('pauseBtn').classList.remove('opacity-50');
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').classList.remove('opacity-50');
            
            // Start trip timer
            state.tripTimerInterval = setInterval(updateTripTimer, 1000);
            
            // Start speed simulation
            state.speedInterval = setInterval(updateSpeed, 2000);
            
            // Update status
            updateStatusBar();
            
            // Add notification
            addNotification('Trip started', 'Just now', 'success');
            
            // Mark first stop as current
            updateCurrentStop(0);
            
            // Send location update to server
            sendLocationToServer();
            
            // Vibrate on start
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function pauseTrip() {
            if (!state.tripStarted) return;
            
            state.tripPaused = !state.tripPaused;
            
            if (state.tripPaused) {
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-play mr-1"></i> Resume';
                document.getElementById('pauseBtn').classList.remove('bg-yellow-500');
                document.getElementById('pauseBtn').classList.add('bg-blue-500');
                clearInterval(state.tripTimerInterval);
                clearInterval(state.speedInterval);
                state.speed = 0;
                updateSpeedDisplay();
                addNotification('Trip paused', 'Just now', 'warning');
            } else {
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause mr-1"></i> Pause';
                document.getElementById('pauseBtn').classList.remove('bg-blue-500');
                document.getElementById('pauseBtn').classList.add('bg-yellow-500');
                state.tripTimerInterval = setInterval(updateTripTimer, 1000);
                state.speedInterval = setInterval(updateSpeed, 2000);
                addNotification('Trip resumed', 'Just now', 'success');
            }
        }

        function stopTrip() {
            if (!state.tripStarted) return;
            
            if (confirm('Are you sure you want to end this trip?')) {
                state.isOnline = false;
                state.tripStarted = false;
                state.tripPaused = false;
                state.speed = 0;
                
                clearInterval(state.tripTimerInterval);
                clearInterval(state.speedInterval);
                
                // Reset UI
                document.getElementById('startBtn').disabled = false;
                document.getElementById('startBtn').classList.remove('opacity-50');
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('pauseBtn').classList.add('opacity-50');
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause mr-1"></i> Pause';
                document.getElementById('pauseBtn').classList.remove('bg-blue-500');
                document.getElementById('pauseBtn').classList.add('bg-yellow-500');
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('stopBtn').classList.add('opacity-50');
                
                updateSpeedDisplay();
                updateStatusBar();
                
                // Send final location to server
                sendLocationToServer(true);
                
                addNotification('Trip ended', 'Just now', 'info');
                
                // Vibrate on stop
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }

        function updateTripTimer() {
            if (state.tripStartTime) {
                state.tripElapsedTime = Math.floor((Date.now() - state.tripStartTime) / 1000);
                const hours = Math.floor(state.tripElapsedTime / 3600);
                const minutes = Math.floor((state.tripElapsedTime % 3600) / 60);
                const seconds = state.tripElapsedTime % 60;
                
                document.getElementById('tripTime').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function updateSpeed() {
            if (state.tripStarted && !state.tripPaused) {
                state.speed = Math.floor(25 + Math.random() * 35);
                updateSpeedDisplay();
                
                // Send speed to server
                sendSpeedToServer();
            }
        }

        function updateSpeedDisplay() {
            document.getElementById('speedDisplay').textContent = state.speed;
        }

        function updatePassengerCount(change) {
            const newCount = Math.max(0, Math.min(state.maxPassengers, state.passengerCount + change));
            if (newCount !== state.passengerCount) {
                state.passengerCount = newCount;
                updatePassengerDisplay();
                sendPassengerCountToServer();
                
                // Haptic feedback
                if (navigator.vibrate) navigator.vibrate(10);
            }
        }

        function updatePassengerDisplay() {
            const percentage = (state.passengerCount / state.maxPassengers) * 100;
            document.getElementById('passengerDisplay').textContent = state.passengerCount;
            document.getElementById('passengerCount').textContent = state.passengerCount;
            document.getElementById('capacityBar').style.width = percentage + '%';
            document.getElementById('capacityText').textContent = Math.round(percentage) + '% Full';
            
            // Update color based on capacity
            const capacityBar = document.getElementById('capacityBar');
            if (percentage > 80) {
                capacityBar.className = 'h-full bg-red-500 transition-all duration-300';
            } else if (percentage > 50) {
                capacityBar.className = 'h-full bg-yellow-500 transition-all duration-300';
            } else {
                capacityBar.className = 'h-full bg-green-500 transition-all duration-300';
            }
        }

        function renderSchedule() {
            const container = document.getElementById('routeProgress');
            container.innerHTML = '';
            
            schedule.forEach((stop, index) => {
                const stopElement = document.createElement('div');
                stopElement.className = 'relative flex items-start space-x-3 ml-2';
                stopElement.id = `stop-${stop.id}`;
                
                const statusIcon = getStatusIcon(stop.status);
                
                stopElement.innerHTML = `
                    <div class="relative z-10">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center bg-white border-2 ${getStatusColor(stop.status)}">
                            <i class="fas ${statusIcon} ${getStatusTextColor(stop.status)} text-sm"></i>
                        </div>
                    </div>
                    <div class="flex-1 pb-2">
                        <div class="flex items-center justify-between">
                            <p class="font-semibold text-sm">${stop.stop}</p>
                            <button class="text-xs text-indigo-600 font-medium" onclick="markStopArrival(${index})">
                                ${stop.status === 'current' ? 'Arrived' : 'Skip'}
                            </button>
                        </div>
                        <p class="text-xs text-gray-600">Arr: ${stop.arrival} | Dep: ${stop.departure}</p>
                    </div>
                `;
                
                container.appendChild(stopElement);
            });
        }

        function updateCurrentStop(index) {
            state.currentStopIndex = index;
            
            // Update schedule statuses
            schedule.forEach((stop, i) => {
                if (i < index) {
                    stop.status = 'completed';
                } else if (i === index) {
                    stop.status = 'current';
                } else {
                    stop.status = 'pending';
                }
            });
            
            renderSchedule();
            updateNextStopDisplay();
        }

        function markStopArrival(index) {
            if (index < schedule.length - 1) {
                updateCurrentStop(index + 1);
                addNotification(`Arrived at ${schedule[index].stop}`, 'Just now', 'success');
                
                // Send stop update to server
                sendStopUpdateToServer(index);
                
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            } else {
                addNotification('Final destination reached', 'Just now', 'success');
                if (confirm('You have reached the final destination. End trip?')) {
                    stopTrip();
                }
            }
        }

        function updateNextStopDisplay() {
            const nextStop = schedule[state.currentStopIndex];
            if (nextStop) {
                document.getElementById('nextStopDisplay').textContent = nextStop.stop;
                document.getElementById('nextStopTime').textContent = nextStop.arrival;
            }
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'completed': return 'fa-check';
                case 'current': return 'fa-bus';
                default: return 'fa-clock';
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'completed': return 'border-green-500';
                case 'current': return 'border-indigo-500';
                default: return 'border-gray-300';
            }
        }

        function getStatusTextColor(status) {
            switch(status) {
                case 'completed': return 'text-green-500';
                case 'current': return 'text-indigo-500';
                default: return 'text-gray-400';
            }
        }

        function updateStatusBar() {
            const indicator = document.getElementById('onlineIndicator');
            const statusText = document.getElementById('statusText');
            
            if (state.isOnline && state.tripStarted && !state.tripPaused) {
                indicator.className = 'w-3 h-3 rounded-full bg-green-400 animate-pulse';
                statusText.textContent = 'ONLINE';
            } else if (state.tripPaused) {
                indicator.className = 'w-3 h-3 rounded-full bg-yellow-400';
                statusText.textContent = 'PAUSED';
            } else {
                indicator.className = 'w-3 h-3 rounded-full bg-gray-400';
                statusText.textContent = 'OFFLINE';
            }
        }

        function startLocationTracking() {
            if (navigator.geolocation) {
                state.locationTrackingInterval = navigator.geolocation.watchPosition(
                    (position) => {
                        // Update coordinates display
                        document.getElementById('latDisplay').textContent = position.coords.latitude.toFixed(4);
                        document.getElementById('lngDisplay').textContent = position.coords.longitude.toFixed(4);
                        
                        // Update GPS status
                        const accuracy = position.coords.accuracy;
                        const gpsStatus = document.getElementById('gpsStatus');
                        if (accuracy < 20) {
                            gpsStatus.textContent = 'Strong';
                            gpsStatus.className = 'text-xs text-green-600';
                        } else if (accuracy < 50) {
                            gpsStatus.textContent = 'Moderate';
                            gpsStatus.className = 'text-xs text-yellow-600';
                        } else {
                            gpsStatus.textContent = 'Weak';
                            gpsStatus.className = 'text-xs text-red-600';
                        }
                        
                        // Send to server if trip is active
                        if (state.tripStarted && !state.tripPaused) {
                            sendLocationToServer();
                        }
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        document.getElementById('gpsStatus').textContent = 'Error';
                        document.getElementById('gpsStatus').className = 'text-xs text-red-600';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        }
